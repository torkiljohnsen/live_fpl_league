name: Preview Narrative

# Manually regenerate a narrative for any gameweek and download the result,
# without touching the published narratives or Reidar's committed memory.
# Everything is written to a throwaway `preview/` directory and uploaded as
# a build artifact. Nothing is committed and no Teams notification is sent.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "FPL league ID"
        required: true
        default: "848662"
      event:
        description: "Gameweek number"
        required: true
      season:
        description: "Season, e.g. 2025-26. Leave blank for the current season."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The narrative reads the report JSON and memory from --output-dir, so
      # copy the committed ones into the sandbox. Last season's reports cannot
      # be rebuilt from the FPL API — it only serves the current season.
      - name: Stage sandbox
        run: |
          mkdir -p preview
          cp -R weekly_report preview/
          ls preview/weekly_report/reports/${{ inputs.league_id }}/*/ || true

      - name: Generate narrative
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SEASON_ARG=""
          if [ -n "${{ inputs.season }}" ]; then
            SEASON_ARG="--season ${{ inputs.season }}"
          fi
          python generate_narrative.py \
            -l ${{ inputs.league_id }} \
            -e ${{ inputs.event }} \
            $SEASON_ARG \
            --output-dir preview \
            --cache-dir .fpl_cache

      - name: Show narrative in the run log
        run: cat preview/docs/narratives/*/${{ inputs.league_id }}/gw${{ inputs.event }}.md

      - name: Upload narrative and updated memory
        uses: actions/upload-artifact@v4
        with:
          name: narrative-${{ inputs.league_id }}-gw${{ inputs.event }}
          path: |
            preview/docs/narratives/
            preview/weekly_report/reidar_memory/
          if-no-files-found: error
