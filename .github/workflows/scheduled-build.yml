name: Hourly Dashboard & Weekly Report

on:
  # Runs hourly during the season; each run exits early unless FPL data changed.
  # To pause for the off-season, comment out the two schedule lines below.
  schedule:
    - cron: "0 * * * *"  # Hourly check
  workflow_dispatch:      # Manual runs skip the check and run everything

permissions:
  contents: write   # Needed to push changes
  pages: write      # Needed to request a Pages rebuild after pushing

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0   # Needed so git can detect changes properly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check gameweek status
        id: gw_check
        run: python check_gw_status.py --cache-dir .fpl_cache

      # Two time windows, both in the Oslo zone rather than a fixed UTC cron
      # hour so they stay put across the winter time change.
      #
      # `daily_refresh` forces a dashboard rebuild every morning. FPL keeps
      # moving the numbers long after the last fixture flips to finished --
      # bonus points land later, and the classic-league standings endpoint
      # refreshes on FPL's own batch schedule -- so a fixture-count delta
      # alone leaves the published standings a day behind. 05:00-08:00 rather
      # than a single hour because scheduled runs drift by up to half an hour
      # and GitHub may drop one entirely; rendering is deterministic, so the
      # later runs simply find no diff and commit nothing.
      #
      # `open` holds Reidar's report back to lunchtime rather than posting it
      # the moment FPL locks the gameweek (09:00 UK / 10:00 Oslo). Open-ended,
      # so a failed 11:00 run is retried by the next hourly one.
      - name: Check time windows
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Oslo"))
          print(f"open={'true' if now.hour >= 11 else 'false'}")
          print(f"daily_refresh={'true' if 5 <= now.hour < 8 else 'false'}")
          print(f"local_time={now:%Y-%m-%d %H:%M %Z}")
          PY

      - name: Time window status
        run: |
          echo "Oslo time: ${{ steps.window.outputs.local_time }}"
          echo "Daily dashboard refresh: ${{ steps.window.outputs.daily_refresh }}"
          echo "Report window open: ${{ steps.window.outputs.open }}"

      # Dashboards: refresh every morning, when new fixtures finish,
      # and when the whole gameweek finishes
      - name: Generate standings and gw history
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
        run: python generate_html.py -l 538233,848662 --cache-dir .fpl_cache

      - name: Generate Index
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
        run: python generate_index.py

      # Tier 2: Whole gameweek finished → report + narrative + notification
      - name: Generate weekly report (JSON)
        if: >-
          steps.gw_check.outputs.has_finished_gameweek == 'true'
          && (github.event_name == 'workflow_dispatch'
              || steps.window.outputs.open == 'true')
        run: python generate_weekly_report.py -l 848662 --skip-existing --cache-dir .fpl_cache

      - name: Generate narrative
        id: narrative
        if: >-
          steps.gw_check.outputs.has_finished_gameweek == 'true'
          && (github.event_name == 'workflow_dispatch'
              || steps.window.outputs.open == 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_narrative.py -l 848662 --skip-existing --cache-dir .fpl_cache

      - name: Copy hero images to docs/assets
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: |
          mkdir -p docs/assets
          for img in weekly_report/reidars_rapport_*.png; do
            cp -n "$img" docs/assets/ 2>/dev/null || true
          done

      # Save state after successful generation so the next run can diff against it.
      # Runs before commit so the updated state file is included in the commit.
      # Only runs when the check step detected changes (or on manual dispatch).
      - name: Save gameweek state
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: python check_gw_status.py --save --cache-dir .fpl_cache

      - name: Commit and push changes
        id: commit
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ .gw_state.json
          for dir in weekly_report/reports weekly_report/reidar_memory; do
            [ -d "$dir" ] && git add "$dir"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: nightly dashboard and report update [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the built-in GITHUB_TOKEN do not trigger the
      # pages-build-deployment workflow, so ask for the build explicitly.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Wait for GitHub Pages deployment
        if: steps.narrative.outputs.generated == 'true'
        run: |
          URL="https://torkiljohnsen.github.io/live_fpl_league/narratives/${SEASON}/${LEAGUE_ID}/gw${GW}.md"
          echo "Waiting for GitHub Pages to deploy: $URL"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Live after ~$((i * 10))s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Warning: timed out after 5min, sending notification anyway"
            fi
            sleep 10
          done
        env:
          SEASON: ${{ steps.narrative.outputs.season }}
          GW: ${{ steps.narrative.outputs.event_id }}
          LEAGUE_ID: "848662"

      - name: Send Teams notification
        if: steps.narrative.outputs.generated == 'true'
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python notify_teams.py -l 848662 --cache-dir .fpl_cache
