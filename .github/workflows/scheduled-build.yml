name: Hourly Dashboard & Weekly Report

on:
  # Runs hourly during the season; each run exits early unless FPL data changed.
  # To pause for the off-season, comment out the two schedule lines below.
  schedule:
    - cron: "0 * * * *"  # Hourly check
  workflow_dispatch:      # Manual runs skip the check and run everything

permissions:
  contents: write   # Needed to push changes
  pages: write      # Needed to request a Pages rebuild after pushing

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0   # Needed so git can detect changes properly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check gameweek status
        id: gw_check
        run: python check_gw_status.py --cache-dir .fpl_cache

      # Two time windows, both in the Oslo zone rather than a fixed UTC cron
      # hour so they stay put across the winter time change.
      #
      # `daily_refresh` forces a dashboard rebuild every morning. FPL keeps
      # moving the numbers long after the last fixture flips to finished --
      # bonus points land later, and the classic-league standings endpoint
      # refreshes on FPL's own batch schedule -- so a fixture-count delta
      # alone leaves the published standings a day behind. The league reads
      # the dashboard when the working day starts at 07:00, so it has to be
      # current by 06:00. GitHub's scheduler is best-effort -- hourly runs
      # land 10-30 min late and one can be dropped outright -- so the window
      # opens at 04:00 to get two attempts in before 06:00 and stays open to
      # 08:00 to pick up anything FPL revises after that. Rendering is
      # deterministic, so the later runs find no diff and commit nothing.
      #
      # `open` holds Reidar's report back to lunchtime rather than posting it
      # the moment FPL locks the gameweek (09:00 UK / 10:00 Oslo). Open-ended,
      # so a failed 11:00 run is retried by the next hourly one.
      - name: Check time windows
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Oslo"))
          print(f"open={'true' if now.hour >= 11 else 'false'}")
          print(f"daily_refresh={'true' if 4 <= now.hour < 8 else 'false'}")
          print(f"local_time={now:%Y-%m-%d %H:%M %Z}")
          PY

      - name: Time window status
        run: |
          echo "Oslo time: ${{ steps.window.outputs.local_time }}"
          echo "Daily dashboard refresh: ${{ steps.window.outputs.daily_refresh }}"
          echo "Report window open: ${{ steps.window.outputs.open }}"

      # Dashboards: refresh every morning, when new fixtures finish,
      # and when the whole gameweek finishes
      - name: Generate standings and gw history
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
        run: python generate_html.py -l 538233,848662 --cache-dir .fpl_cache

      - name: Generate Index
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
        run: python generate_index.py

      # Tier 2: Whole gameweek finished → report + narrative + notification
      - name: Generate weekly report (JSON)
        if: >-
          steps.gw_check.outputs.has_finished_gameweek == 'true'
          && (github.event_name == 'workflow_dispatch'
              || steps.window.outputs.open == 'true')
        run: python generate_weekly_report.py -l 848662 --skip-existing --cache-dir .fpl_cache

      - name: Generate narrative
        id: narrative
        if: >-
          steps.gw_check.outputs.has_finished_gameweek == 'true'
          && (github.event_name == 'workflow_dispatch'
              || steps.window.outputs.open == 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_narrative.py -l 848662 --skip-existing --cache-dir .fpl_cache

      # The manifest (docs/narratives/index.json) feeds the front page and the
      # article page's prev/next arrows, so rebuild it once the new narrative
      # is on disk — the earlier index step ran before it existed.
      - name: Regenerate index with the new narrative
        if: steps.narrative.outputs.generated == 'true'
        run: python generate_index.py

      - name: Copy hero images to docs/assets
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: |
          mkdir -p docs/assets
          for img in weekly_report/reidars_rapport_*.png; do
            cp -n "$img" docs/assets/ 2>/dev/null || true
          done

      # Save state after successful generation so the next run can diff against it.
      # Runs before commit so the updated state file is included in the commit.
      # Only runs when the check step detected changes (or on manual dispatch).
      - name: Save gameweek state
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: python check_gw_status.py --save --cache-dir .fpl_cache

      - name: Commit and push changes
        id: commit
        if: >-
          github.event_name == 'workflow_dispatch'
          || steps.window.outputs.daily_refresh == 'true'
          || steps.gw_check.outputs.has_new_finished_fixtures == 'true'
          || steps.gw_check.outputs.gameweek_finished == 'true'
          || steps.narrative.outputs.generated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ .gw_state.json
          for dir in weekly_report/reports weekly_report/reidar_memory; do
            [ -d "$dir" ] && git add "$dir"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: nightly dashboard and report update [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the built-in GITHUB_TOKEN do not trigger the
      # pages-build-deployment workflow, so ask for the build explicitly.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      # Asked after the push rather than derived from the narrative step, so
      # a card held back by an earlier run is picked up again here. Answers
      # "is there a narrative on disk the league has not been told about?"
      - name: Check for a report waiting to be announced
        id: pending
        run: python check_gw_status.py --pending-notification -l 848662 --cache-dir .fpl_cache

      # A card whose link 404s is worse than a card that arrives late, so the
      # notification waits until the file the article page fetches is actually
      # being served. On a timeout this step fails the run: the gameweek is
      # never marked as notified, so the next hourly run retries the wait and
      # the card follows once Pages catches up.
      - name: Wait for the narrative to be live on GitHub Pages
        if: steps.pending.outputs.pending_notification == 'true'
        run: |
          URL="https://torkiljohnsen.github.io/live_fpl_league/narratives/${SEASON}/${LEAGUE_ID}/gw${GW}.md"
          echo "Waiting for GitHub Pages to serve: $URL"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Live after ~$((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL still returns $STATUS after 5 min. Holding the Teams notification back; the next hourly run retries."
          exit 1
        env:
          SEASON: ${{ steps.pending.outputs.pending_season }}
          GW: ${{ steps.pending.outputs.pending_event }}
          LEAGUE_ID: "848662"

      # No continue-on-error: a failed send leaves the gameweek unmarked, so
      # the next hourly run tries again rather than dropping the card silently.
      - name: Send Teams notification
        if: steps.pending.outputs.pending_notification == 'true'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GW: ${{ steps.pending.outputs.pending_event }}
        run: |
          python notify_teams.py -l 848662 -e "$GW" --cache-dir .fpl_cache
          python check_gw_status.py --mark-notified "$GW"

      # The marker is written after the push above, so it needs its own commit.
      - name: Commit notification state
        if: steps.pending.outputs.pending_notification == 'true'
        env:
          GW: ${{ steps.pending.outputs.pending_event }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gw_state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: mark GW${GW} report as announced [skip ci]"
            git pull --rebase
            git push
          fi
